# /etc/nginx/sites-available/arudhya-erp   (certbot adds the HTTPS parts)
server {
    listen 80;
    server_name erp.yourdomain.com;
    client_max_body_size 25M;

    root /opt/arudhya-erp/frontend/dist;          # React build
    index index.html;
    location / { try_files $uri /index.html; }    # SPA routing

    location /media/  { alias /opt/arudhya-erp/backend/media/; }

    location ~ ^/(api|admin|static)/ {
        proxy_pass http://unix:/opt/arudhya-erp/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
